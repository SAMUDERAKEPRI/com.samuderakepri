<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samudera Kepri — Portal Berita & Jurnalisme Investigasi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    .badge {
      display: inline-block;
      background: #b91c1c;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 10px;
      color: #ffffff;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 24px;
    }
    .pkg {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      background: rgba(15, 23, 42, 0.7);
      color: #fde047;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: inline-block;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.btn {
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.2s ease;
    }
    a.btn:hover { opacity: 0.9; }
    .btn-primary {
      background: #f59e0b;
      color: #0f172a;
    }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">SAMUDERA KEPRI</div>
    <h1>Samudera Kepri</h1>
    <p>Portal berita terkini Kepulauan Riau dan jurnalisme investigasi terpercaya.</p>
    <div class="pkg">Package: com.samuderakepri</div>
    <div class="actions">
      <a class="btn btn-primary" href="https://www.samuderakepri.co.id" rel="noopener noreferrer">
        Buka Portal Resmi
      </a>
      <a class="btn btn-secondary" href="https://github.com/SAMUDERAKEPRI/com.samuderakepri" rel="noopener noreferrer">
        Repositori GitHub
      </a>
    </div>
  </main>
</body>
</html>
